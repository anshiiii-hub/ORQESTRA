name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orqestra_test
          POSTGRES_USER: orqestra_test
          POSTGRES_PASSWORD: disposable_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orqestra_test -d orqestra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m app.export_contracts --check
      - run: pytest -q
      - name: PostgreSQL migrations, API and access control
        run: pytest -q tests/test_migrations_api.py tests/test_auth_rbac.py tests/test_agent_runtime.py tests/test_planning_runtime.py tests/test_worker_leases.py tests/test_routing.py tests/test_memory.py tests/test_approvals.py tests/test_reporting_verification.py tests/test_checkpoint_recovery_benchmarks.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://orqestra_test:disposable_ci_password@localhost:5432/orqestra_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
