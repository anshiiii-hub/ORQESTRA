x-planner-environment: &planner-environment
  LLM_PLANNER_ENABLED: ${LLM_PLANNER_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_INPUT_PRICE_PER_MILLION: ${LLM_INPUT_PRICE_PER_MILLION:-}
  LLM_OUTPUT_PRICE_PER_MILLION: ${LLM_OUTPUT_PRICE_PER_MILLION:-}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestra
      POSTGRES_USER: orchestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev_only_change_me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestra -d orchestra"]
      interval: 5s
      retries: 15
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://orchestra:${POSTGRES_PASSWORD:-localdev_only_change_me}@postgres:5432/orchestra
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: ./backend
    environment:
      <<: *planner-environment
      DATABASE_URL: postgresql+psycopg://orchestra:${POSTGRES_PASSWORD:-localdev_only_change_me}@postgres:5432/orchestra
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DISABLED_AGENTS: ${DISABLED_AGENTS:-}
      RESEARCH_ENABLED: ${RESEARCH_ENABLED:-false}
      RESEARCH_ALLOWED_DOMAINS: ${RESEARCH_ALLOWED_DOMAINS:-}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      DOCKER_HOST: ${SANDBOX_DOCKER_HOST:-}
      DOCKER_TLS_VERIFY: ${SANDBOX_DOCKER_TLS_VERIFY:-}
      DOCKER_CERT_PATH: ${SANDBOX_DOCKER_CERT_PATH:-/run/sandbox-docker-certs}
    ports: ["127.0.0.1:${API_PORT:-8001}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *planner-environment
      DATABASE_URL: postgresql+psycopg://orchestra:${POSTGRES_PASSWORD:-localdev_only_change_me}@postgres:5432/orchestra
      DISABLED_AGENTS: ${DISABLED_AGENTS:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8001}
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
